name: CI

# Trigger on push to any branch and on pull requests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MPI + HDF5
        run: |
          sudo apt update
          sudo apt install -y \
              openmpi-bin \
              libopenmpi-dev \
              libhdf5-openmpi-dev \
              python3-dev

      - name: Install dependencies
        env:
          CC: mpicc
          CXX: mpicxx
          MPICC: mpicc
          HDF5_MPI: "ON"
          HDF5_DIR: /usr/lib/x86_64-linux-gnu/hdf5/openmpi
        run: |
          pip install --upgrade pip setuptools wheel cython numpy
          pip install mpi4py
          pip install --no-cache-dir --no-binary=h5py h5py --no-build-isolation
          pip install git+https://github.com/openbraininstitute/neurodamus.git@main
          pip install -e ".[test]"

      - name: Run tests
        run: pytest -v -m "not skip_in_ci" tests/unit

      - name: Run MPI tests
        run: mpirun -n 2 pytest -v -m "not skip_in_ci" tests/unit-mpi --with-mpi
