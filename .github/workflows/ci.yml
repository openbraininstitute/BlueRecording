name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  NEURODAMUS_COMMIT: "4.2.1"
  NEURODAMUS_NEOCORTEX_ROOT: ${{ github.workspace }}/neurodamus-models/build/install

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tox
        run: pip install tox

      - name: Lint and format check
        run: tox -e check

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
              openmpi-bin \
              libopenmpi-dev \
              libhdf5-openmpi-dev \
              python3-dev \
              bison \
              ninja-build

      - name: Install Python dependencies
        env:
          CC: mpicc
          CXX: mpicxx
          MPICC: mpicc
          HDF5_MPI: "ON"
          HDF5_DIR: /usr/lib/x86_64-linux-gnu/hdf5/openmpi
        run: |
          pip install --upgrade pip setuptools wheel cython numpy
          pip install mpi4py
          pip install --no-cache-dir --no-binary=h5py h5py --no-build-isolation
          pip install git+https://github.com/openbraininstitute/neurodamus.git@${{ env.NEURODAMUS_COMMIT }}
          pip install -e ".[neuron,test]"

      - name: Build neurodamus-models
        run: |
          git clone --depth=1 https://github.com/openbraininstitute/neurodamus-models.git
          NEURODAMUS_PYTHON=$(python -c "import neurodamus; from pathlib import Path; print(Path(neurodamus.__file__).parent / 'data')")
          cmake -B neurodamus-models/build -S neurodamus-models/ \
              -DPython_EXECUTABLE=$(which python) \
              -DCMAKE_INSTALL_PREFIX=${{ env.NEURODAMUS_NEOCORTEX_ROOT }} \
              -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
              -DNEURODAMUS_CORE_DIR=${NEURODAMUS_PYTHON} \
              -DNEURODAMUS_MECHANISMS=neocortex \
              -DNEURODAMUS_NCX_V5=ON \
              -DNEURODAMUS_ENABLE_REPORTING=OFF
          cmake --build neurodamus-models/build
          cmake --install neurodamus-models/build

      - name: Set test environment
        run: |
          echo "HOC_LIBRARY_PATH=${{ env.NEURODAMUS_NEOCORTEX_ROOT }}/share/neurodamus_neocortex/hoc" >> $GITHUB_ENV
          echo "CORENEURONLIB=${{ env.NEURODAMUS_NEOCORTEX_ROOT }}/lib/libcorenrnmech.so" >> $GITHUB_ENV
          echo "NRNMECH_LIB_PATH=${{ env.NEURODAMUS_NEOCORTEX_ROOT }}/lib/libnrnmech.so" >> $GITHUB_ENV
          echo "${{ env.NEURODAMUS_NEOCORTEX_ROOT }}/bin" >> $GITHUB_PATH

      - name: Run unit tests
        run: pytest -v -m "not skip_in_ci" tests/unit

      - name: Run integration tests
        run: pytest -v -m "not skip_in_ci" tests/integration --forked

      - name: Run MPI unit tests
        run: mpirun --oversubscribe -n 2 pytest -v -m "not skip_in_ci" tests/unit-mpi --with-mpi

      - name: Run MPI integration tests
        run: |
          for f in tests/integration-mpi/test_*.py; do
            # Check if any tests match the marker filter before running mpirun
            selected=$(python -m pytest "$f" --collect-only -q -m "not skip_in_ci" 2>/dev/null | grep -c "test_" || true)
            if [ "$selected" -eq 0 ]; then
              echo "--- skipping $f (no matching tests) ---"
              continue
            fi
            mpirun --oversubscribe -n 2 pytest -v -m "not skip_in_ci" "$f" --with-mpi
          done
